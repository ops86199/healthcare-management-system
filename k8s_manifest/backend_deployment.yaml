apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-container
        image: HealthCMS-backend-image:latest 
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: DB_HOST
          value: "postgres-DB"
        - name: DB_PORT
          value: "5432"
        - name: DB_NME
          value: "healthcms_db"
        - name: DB_USER
          value: "DB_USER"
        - name: "DB_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD